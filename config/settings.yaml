# Lighter.xyz Trading Bot Configuration
lighter:
  # Network configuration
  rest_url: "https://mainnet.zklighter.elliot.ai"
  ws_url: "wss://mainnet.zklighter.elliot.ai/stream"
  chain_id: 304

  # Connection parameters
  connection:
    timeout_ms: 10000
    retry_count: 5
    retry_delay_ms: 2000
    heartbeat_interval_ms: 60000

# Trading configuration
trading:
  # Markets to trade (market_id: 0=ETH, 1=BTC)
  # 2026-08-09 用户选择方案 A（双标的高频化）: 加入 ETH。共享 7/21/0.05/0.06 参数。
  # 代价: 全周期 +9.65% → ~+4.4~7.5%（按权重），频率 4.6 → ~12.6 笔/月；ETH 本身无 alpha（详见 trend-scan-20260809/FINDINGS.md）。
  markets: [0, 1]

  # Maximum number of open orders at any time
  max_open_orders: 8

  # Strategy configuration
  # 2026-08-08 切换为趋势策略（fast=7/slow=21/sl=0.05/tp=0.06, notional=60）:
  #   延伸数据（01-01~08-08）1080 组全周期扫描：8-02 候选 14/50/notional=200 在延伸窗口 DD 22.21% 超 10% 门禁 → 弃用
  #   门禁合规终选 7/21/0.05/0.06/cmin0.005/clb3/notional=60：+9.58%，Sharpe 1.83，MaxDD 4.28%，33 笔，峰值杠杆 0.25x，0 强平
  #   grid 实盘同款（12/50/0.004）延伸全周期 -81.08%、跑输 BTC 基准 55pt —— 亏损根因，改由 JSON 门禁提案切换（proposal mLpojIk0ZtbWrZ8uTO）
  #   多窗口方向性：01-03 +13.9%、03-05 +15.0%、05-06 +7.2%、06-08 -3.5%（斜率确认在震荡市减仓，OOS 08-02~08 0 笔）
  #   详细记录: backtests/results/trend-scan-20260808/FINDINGS.md（gitignore，不进版本库）
  #   回滚方法: grid_trading.enabled 改回 true、trend_following.enabled 改回 false，重启 pm2
  strategies:
    grid_trading:
      enabled: false
      grid_count: 12
      investment_per_grid: 30
      price_deviation: 0.004

    trend_following:
      enabled: true
      fast_ma: 7
      slow_ma: 21
      stop_loss: 0.05
      take_profit: 0.06
      trailing_stop: 0.0
      # 2026-08-09 双标的上线: 60→30，与 data/strategy_config.json 保持一致（两标的共享，合计敞口与原来单标 60 相当）
      notional: 30
      # ADX 震荡过滤：>0 启用（低于该值=震荡市禁新开仓），0=关闭。默认关闭，回测 A/B 验证后再开。
      adx_threshold: 0
      adx_period: 14
      # 慢线斜率确认：>0 启用（开多需 slow EMA 在 lookback 内上涨该比例，开空则下跌），0=关闭。
      # 只过滤进场、不影响离场。8-02 A/B 验证后启用；clb 从 5 下调到 3 配合 7/21 快线族（延伸扫描最优）。
      # ADX 保持关闭。
      confirm_slope_min: 0.005
      confirm_lookback: 3

  # Position management
  position:
    max_single_trade_percent: 50
    max_total_position_percent: 200
    risk_per_trade_percent: 1.5

# Conservative round-trip profitability gate for live entries (1 bp = 0.01%).
# These are floors, not advertised 0 maker/taker marketing fees. Keep a
# 1 bp/side fee floor plus slippage and adverse selection unless fills
# measure a true 0 fee at the fill level.
profitability:
  enabled: true
  entry_fee_bps: 1.0
  exit_fee_bps: 1.0
  entry_slippage_bps: 2.0
  exit_slippage_bps: 2.0
  funding_bps: 0.5
  adverse_selection_bps: 3.0
  min_net_edge_bps: 2.0

# Risk management
risk:
  stop_loss:
    enabled: true
    max_drawdown_percent: 10
    daily_loss_limit_percent: 5
    # Per-position stop-loss/take-profit (percentage from entry)
    position_stop_loss_percent: 3
    position_take_profit_percent: 5

  position_limit:
    max_leverage: 5
    max_position_size: 100

  monitoring_interval_ms: 1000

# Backtest configuration
backtest:
  data:
    start_date: "2024-01-01"
    end_date: "2024-06-01"
    interval: "1h"

  initial_capital: 10000
  # 2 bps per side floor — not a marketing 0-fee assumption.
  commission_percent: 0.0002
  slippage_percent: 0.02

  reporting:
    generate_html: true
    save_trades: true
    plot_equity_curve: true

# Dashboard
dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 2028
  refresh_interval_ms: 1000

  charts:
    equity_curve_points: 1000
    order_book_depth: 20

# Logging
logging:
  level: "info"
  file: "logs/lighter-bot.log"
  rotation: "daily"
  format: "json"
